[tool.poetry]
name = "struct_solver"
version = "1.0.0"
description = ""
authors = ["scatsoulis"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">3.9"
ruff = ">=0.2.1"
pre-commit = ">=3.6.2"

[tool.build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["E501"]
ignore = ["E402", "PLR0913"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 20